[package]
name = "brightness-prototype"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local prototype console for monitor brightness hotkeys"

[[bin]]
name = "brightness-proto"
path = "src/main.rs"

[dependencies]
brightness-core = { path = "../brightness-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
